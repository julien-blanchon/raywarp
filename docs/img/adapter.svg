<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 924 260" role="img">
  <title>Adapter playbook: coverage table, Ingest, Bind, conformance kit (the gate), optional settings map and integration drop-ins</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="g" x="0" y="0" width="280" height="84" rx="6"/>
  <text class="t m" x="140" y="29.4">1 coverage table</text>
  <text class="d m" x="140" y="48.4">each source feature: converted,</text>
  <text class="d m" x="140" y="65.4">approximated or dropped</text>
  <rect class="g" x="320" y="0" width="280" height="84" rx="6"/>
  <text class="t m" x="460" y="29.4">2 Ingest</text>
  <text class="d m" x="460" y="48.4">scene(source) -&gt; Scene via a</text>
  <text class="d m" x="460" y="65.4">SceneBuilder; LoadReport counters</text>
  <path class="ln" d="M280,42 H318" marker-end="url(#ah)"/>
  <rect class="g" x="640" y="0" width="280" height="84" rx="6"/>
  <text class="t m" x="780" y="29.4">3 Bind</text>
  <text class="d m" x="780" y="48.4">binding(scene, source) -&gt; Binding[S]:</text>
  <text class="d m" x="780" y="65.4">slots(sim), no host copy</text>
  <path class="ln" d="M600,42 H638" marker-end="url(#ah)"/>
  <rect class="r" x="0" y="120" width="280" height="84" rx="6"/>
  <text class="t m" x="140" y="140.9">4 conformance kit</text>
  <text class="d m" x="140" y="159.9">compare, report_mismatches,</text>
  <text class="d m" x="140" y="176.9">check_no_recompile,</text>
  <text class="d m" x="140" y="193.9">check_graph_replay</text>
  <rect class="n ds" x="320" y="120" width="280" height="84" rx="6"/>
  <text class="t m" x="460" y="149.4">5 settings map</text>
  <text class="d m" x="460" y="168.4">source render settings -&gt;</text>
  <text class="d m" x="460" y="185.4">RenderSettings, explicitly</text>
  <path class="ln" d="M280,162 H318" marker-end="url(#ah)"/>
  <rect class="n ds" x="640" y="120" width="280" height="84" rx="6"/>
  <text class="t m" x="780" y="140.9">6 integration</text>
  <text class="d m" x="780" y="159.9">drop-ins for the source's renderer:</text>
  <text class="d m" x="780" y="176.9">SensorCamera,</text>
  <text class="d m" x="780" y="193.9">ViewerRaywarpHeadless, ...</text>
  <path class="ln" d="M600,162 H638" marker-end="url(#ah)"/>
  <path class="ln" d="M780,84 V102 H140 V118" marker-end="url(#ah)"/>
  <rect class="g" x="0" y="225" width="22" height="14" rx="3"/>
  <text class="c" x="30" y="236">required</text>
  <rect class="r" x="105.84" y="225" width="22" height="14" rx="3"/>
  <text class="c" x="135.84" y="236">the gate: tests/fixtures/conformance.py</text>
  <rect class="n ds" x="388.09" y="225" width="22" height="14" rx="3"/>
  <text class="c" x="418.09" y="236">optional</text>
</svg>
