<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 944 266" role="img">
  <title>One Renderer.render(sim) call: ten steps, host work in amber, device work in green; the validation flags are read one frame late</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="a" x="0" y="24" width="160" height="72" rx="6"/>
  <text class="t m" x="80" y="47.4">1 backend.prepare</text>
  <text class="d m" x="80" y="66.4">waits for background</text>
  <text class="d m" x="80" y="83.4">compiles and builds</text>
  <rect class="a" x="190" y="24" width="160" height="72" rx="6"/>
  <text class="t m" x="270" y="47.4">2 poll validation</text>
  <text class="d m" x="270" y="66.4">last frame's flags:</text>
  <text class="d m" x="270" y="83.4">refit shared or raise</text>
  <path class="ln" d="M160,60 H188" marker-end="url(#ah)"/>
  <rect class="g" x="380" y="24" width="160" height="72" rx="6"/>
  <text class="t m" x="460" y="47.4">3 binding writes</text>
  <text class="d m" x="460" y="66.4">poses into renderer</text>
  <text class="d m" x="460" y="83.4">buffers (Newton)</text>
  <path class="ln" d="M350,60 H378" marker-end="url(#ah)"/>
  <rect class="a" x="570" y="24" width="160" height="72" rx="6"/>
  <text class="t m" x="650" y="47.4">4 Frame</text>
  <text class="d m" x="650" y="66.4">per-world &gt; binding</text>
  <text class="d m" x="650" y="83.4">&gt; scene tables</text>
  <path class="ln" d="M540,60 H568" marker-end="url(#ah)"/>
  <rect class="g" x="760" y="24" width="160" height="72" rx="6"/>
  <text class="t m" x="840" y="47.4">5 pack lights</text>
  <text class="d m" x="840" y="66.4">camera poses,</text>
  <text class="d m" x="840" y="83.4">history.begin</text>
  <path class="ln" d="M730,60 H758" marker-end="url(#ah)"/>
  <rect class="g" x="0" y="136" width="160" height="72" rx="6"/>
  <text class="t m" x="80" y="159.4">6 backend.refit</text>
  <text class="d m" x="80" y="178.4">world BVH or</text>
  <text class="d m" x="80" y="195.4">OptiX IAS</text>
  <rect class="g" x="190" y="136" width="160" height="72" rx="6"/>
  <text class="t m" x="270" y="159.4">7 bakes</text>
  <text class="d m" x="270" y="178.4">GI probes, light grid</text>
  <text class="d m" x="270" y="195.4">(first use, changes)</text>
  <path class="ln" d="M160,172 H188" marker-end="url(#ah)"/>
  <rect class="g" x="380" y="136" width="160" height="72" rx="6"/>
  <text class="t m" x="460" y="159.4">8 backend.launch</text>
  <text class="d m" x="460" y="178.4">megakernel or</text>
  <text class="d m" x="460" y="195.4">OptiX raygen</text>
  <path class="ln" d="M350,172 H378" marker-end="url(#ah)"/>
  <rect class="g" x="570" y="136" width="160" height="72" rx="6"/>
  <text class="t m" x="650" y="159.4">9 post passes</text>
  <text class="d m" x="650" y="178.4">area shadows,</text>
  <text class="d m" x="650" y="195.4">display, sensor</text>
  <path class="ln" d="M540,172 H568" marker-end="url(#ah)"/>
  <rect class="g" x="760" y="136" width="160" height="72" rx="6"/>
  <text class="t m" x="840" y="159.4">10 validation</text>
  <text class="d m" x="840" y="178.4">one kernel, 8 bytes</text>
  <text class="d m" x="840" y="195.4">to pinned memory</text>
  <path class="ln" d="M730,172 H758" marker-end="url(#ah)"/>
  <path class="ln" d="M840,96 V116 H80 V134" marker-end="url(#ah)"/>
  <path class="ln ds" style="stroke:#e11d48" d="M920,172 H932 V10 H270 V22" marker-end="url(#ah)"/>
  <text class="c" x="0" y="232">Amber: host work, no device sync. Green: device work; from the second frame with the same inputs, render() replays it as one CUDA graph.</text>
  <text class="c" x="0" y="252">Dashed: step 10's flag word is read by step 2 of the next render, one frame late (core/pipeline/renderer.py, eager_frame).</text>
</svg>
