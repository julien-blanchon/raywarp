<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 924 304" role="img">
  <title>From settings to a compiled kernel: resolve_features and canonical give Features (compile time, the kernel cache key) and Params (runtime values)</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="b" x="0" y="0" width="210" height="50" rx="6"/>
  <text class="t m" x="105" y="20.9">RenderSettings</text>
  <text class="d m" x="105" y="39.9">groups, fields C or R</text>
  <path class="ln" d="M210,25 L268,88" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="60" width="210" height="50" rx="6"/>
  <text class="t m" x="105" y="80.9">RenderCaps</text>
  <text class="d m" x="105" y="99.9">scene capabilities</text>
  <path class="ln" d="M210,85 L268,106" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="120" width="210" height="50" rx="6"/>
  <text class="t m" x="105" y="140.9">PerWorld</text>
  <text class="d m" x="105" y="159.9">what varies per world</text>
  <path class="ln" d="M210,145 L268,124" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="180" width="210" height="50" rx="6"/>
  <text class="t m" x="105" y="200.9">DeviceCaps</text>
  <text class="d m" x="105" y="219.9">OptiX, CUDA graphs</text>
  <path class="ln" d="M210,205 L268,142" marker-end="url(#ah)"/>
  <rect class="a" x="270" y="60" width="200" height="110" rx="6"/>
  <text class="t m" x="370" y="93.9">resolve_features</text>
  <text class="d m" x="370" y="112.9">pure host function:</text>
  <text class="d m" x="370" y="129.9">"auto" -&gt; capabilities,</text>
  <text class="d m" x="370" y="146.9">then canonical(f)</text>
  <rect class="v" x="530" y="0" width="180" height="100" rx="6"/>
  <text class="t m" x="620" y="37.4">Features (C)</text>
  <text class="d m" x="620" y="56.4">the kernel cache key;</text>
  <text class="d m" x="620" y="73.4">off code is not emitted</text>
  <rect class="g" x="530" y="130" width="180" height="100" rx="6"/>
  <text class="t m" x="620" y="158.9">Params (R)</text>
  <text class="d m" x="620" y="177.9">runtime values and</text>
  <text class="d m" x="620" y="194.9">per-world tables:</text>
  <text class="d m" x="620" y="211.9">never recompile</text>
  <path class="ln" d="M470,96 L528,58" marker-end="url(#ah)"/>
  <path class="ln" d="M470,134 L528,170" marker-end="url(#ah)"/>
  <rect class="v" x="760" y="0" width="160" height="48" rx="6"/>
  <text class="t m" x="840" y="19.9">megakernel(f)</text>
  <text class="d m" x="840" y="38.9">functools.cache</text>
  <path class="ln" d="M710,50 L758,24" marker-end="url(#ah)"/>
  <rect class="v" x="760" y="56" width="160" height="48" rx="6"/>
  <text class="t m" x="840" y="75.9">Warp kernel cache</text>
  <text class="d m" x="840" y="94.9">on disk, prebuilt</text>
  <path class="ln" d="M710,50 L758,80" marker-end="url(#ah)"/>
  <rect class="v" x="760" y="112" width="160" height="48" rx="6"/>
  <text class="t m" x="840" y="131.9">OptiX build</text>
  <text class="d m" x="840" y="150.9">keyed by spec_key</text>
  <path class="ln" d="M710,50 L758,136" marker-end="url(#ah)"/>
  <rect class="g" x="760" y="180" width="160" height="50" rx="6"/>
  <text class="t m" x="840" y="200.9">next frame</text>
  <text class="d m" x="840" y="219.9">reads new values</text>
  <path class="ln" d="M710,195 L758,205" marker-end="url(#ah)"/>
  <text class="c" x="0" y="262">A C field changed (update_settings): another Features, the cached kernel for it or one compile. An R field: new Params next frame.</text>
  <text class="c" x="0" y="282">canonical() collapses values the kernel cannot see (shadow fields with shadows off, ...), so equivalent settings share one kernel.</text>
</svg>
