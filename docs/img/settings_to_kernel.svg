<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="sans-serif" font-size="13">
  <title>From settings to a compiled kernel: resolve_features, canonical, Features and Params, kernel caches</title>
  <style>
    text { fill: #1f2328; }
    .muted { fill: #57606a; font-size: 11px; }
    .h { font-weight: bold; font-size: 14px; }
    .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .head { fill: #57606a; }
    .in { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .fn { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.4; }
    .c { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.4; }
    .r { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .in { fill: #0c2d6b; stroke: #4493f8; }
      .fn { fill: #04260f; stroke: #3fb950; }
      .c { fill: #3c0a0d; stroke: #f85149; }
      .r { fill: #3b2e00; stroke: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="in" x="20" y="20" width="220" height="56" rx="6"/>
  <text class="h" x="130" y="42" text-anchor="middle">RenderSettings</text>
  <text class="muted" x="130" y="62" text-anchor="middle">frozen groups; field metadata C / R</text>
  <rect class="in" x="20" y="90" width="220" height="56" rx="6"/>
  <text class="h" x="130" y="112" text-anchor="middle">RenderCaps</text>
  <text class="muted" x="130" y="132" text-anchor="middle">scene capabilities, layout, cameras</text>
  <rect class="in" x="20" y="160" width="220" height="56" rx="6"/>
  <text class="h" x="130" y="182" text-anchor="middle">PerWorld declaration</text>
  <text class="muted" x="130" y="202" text-anchor="middle">what may vary per world</text>
  <rect class="in" x="20" y="230" width="220" height="56" rx="6"/>
  <text class="h" x="130" y="252" text-anchor="middle">DeviceCaps</text>
  <text class="muted" x="130" y="272" text-anchor="middle">core/device.py: OptiX, graphs</text>

  <rect class="fn" x="300" y="110" width="200" height="86" rx="6"/>
  <text class="h" x="400" y="134" text-anchor="middle">resolve_features</text>
  <text class="muted" x="400" y="154" text-anchor="middle">core/resolve.py (pure, host)</text>
  <text class="muted" x="400" y="170" text-anchor="middle">"auto" -&gt; scene capabilities</text>
  <text class="muted" x="400" y="186" text-anchor="middle">then canonical(f)</text>
  <path class="line" d="M240,48 L298,124" marker-end="url(#a)"/>
  <path class="line" d="M240,118 L298,142" marker-end="url(#a)"/>
  <path class="line" d="M240,188 L298,166" marker-end="url(#a)"/>
  <path class="line" d="M240,258 L298,186" marker-end="url(#a)"/>

  <rect class="c" x="560" y="40" width="190" height="86" rx="6"/>
  <text class="h" x="655" y="64" text-anchor="middle">Features (C)</text>
  <text class="muted" x="655" y="84" text-anchor="middle">kernels/features.py</text>
  <text class="muted" x="655" y="100" text-anchor="middle">wp.static branches:</text>
  <text class="muted" x="655" y="116" text-anchor="middle">off code is not emitted</text>
  <rect class="r" x="560" y="190" width="190" height="86" rx="6"/>
  <text class="h" x="655" y="214" text-anchor="middle">Params (R)</text>
  <text class="muted" x="655" y="234" text-anchor="middle">kernels/structs.py</text>
  <text class="muted" x="655" y="250" text-anchor="middle">+ per-world tables (Frame)</text>
  <text class="muted" x="655" y="266" text-anchor="middle">changes never recompile</text>
  <path class="line" d="M500,140 L558,96" marker-end="url(#a)"/>
  <path class="line" d="M500,170 L558,220" marker-end="url(#a)"/>

  <rect class="fn" x="800" y="20" width="145" height="56" rx="6"/>
  <text class="h" x="872" y="42" text-anchor="middle">megakernel(f)</text>
  <text class="muted" x="872" y="62" text-anchor="middle">functools.cache</text>
  <rect class="fn" x="800" y="90" width="145" height="56" rx="6"/>
  <text class="h" x="872" y="112" text-anchor="middle">Warp kernel cache</text>
  <text class="muted" x="872" y="132" text-anchor="middle">on disk, by module hash</text>
  <rect class="fn" x="800" y="160" width="145" height="56" rx="6"/>
  <text class="h" x="872" y="182" text-anchor="middle">OptiX build</text>
  <text class="muted" x="872" y="202" text-anchor="middle">launch.spec_key, PTX</text>
  <path class="line" d="M750,70 L798,50" marker-end="url(#a)"/>
  <path class="line" d="M750,90 L798,116" marker-end="url(#a)"/>
  <path class="line" d="M750,110 L798,180" marker-end="url(#a)"/>
  <path class="line" d="M750,240 C780,240 790,230 870,218" marker-end="url(#a)"/>

  <text class="muted" x="20" y="320">C field changed (update_settings): another Features -&gt; the cached kernel for it, or a compile (seconds).</text>
  <text class="muted" x="20" y="338">R field changed: new Params values next frame. metadata "rebuild" ("gi", "light_grid"): that structure is dropped and rebuilt.</text>
  <text class="muted" x="20" y="356">canonical(): values the kernel cannot see (shadow fields with shadows off, ...) collapse, so equivalent settings share one kernel.</text>
</svg>
