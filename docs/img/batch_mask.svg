<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 904 266" role="img">
  <title>render(sim, active=ids): ids is a (k,) int32 device array with -1 holes; listed worlds are rendered, the others keep their last image; frame time follows k</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="ct" x="0" y="14">r.render(sim, active=ids)</text>
  <text class="c e" x="300" y="53">ids: (k,) int32 on the device</text>
  <rect class="b" x="314" y="30" width="56" height="34" rx="6"/>
  <text class="t m" x="342" y="52">3</text>
  <rect class="b" x="378" y="30" width="56" height="34" rx="6"/>
  <text class="t m" x="406" y="52">0</text>
  <rect class="n" x="442" y="30" width="56" height="34" rx="6"/>
  <text class="t m" x="470" y="52">-1</text>
  <rect class="b" x="506" y="30" width="56" height="34" rx="6"/>
  <text class="t m" x="534" y="52">5</text>
  <text class="c" x="574" y="53">k = 4</text>
  <text class="c m" x="470" y="84">hole: skipped</text>
  <path class="ln" d="M342,66 L396,136" marker-end="url(#ah)"/>
  <path class="ln" d="M406,66 L72,136" marker-end="url(#ah)"/>
  <path class="ln" d="M534,66 L612,136" marker-end="url(#ah)"/>
  <rect class="g" x="24" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="72" y="161.9">world 0</text>
  <text class="d m" x="72" y="180.9">new image</text>
  <rect class="n" x="132" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="180" y="161.9">world 1</text>
  <text class="d m" x="180" y="180.9">last image</text>
  <rect class="n" x="240" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="288" y="161.9">world 2</text>
  <text class="d m" x="288" y="180.9">last image</text>
  <rect class="g" x="348" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="396" y="161.9">world 3</text>
  <text class="d m" x="396" y="180.9">new image</text>
  <rect class="n" x="456" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="504" y="161.9">world 4</text>
  <text class="d m" x="504" y="180.9">last image</text>
  <rect class="g" x="564" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="612" y="161.9">world 5</text>
  <text class="d m" x="612" y="180.9">new image</text>
  <rect class="n" x="672" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="720" y="161.9">world 6</text>
  <text class="d m" x="720" y="180.9">last image</text>
  <rect class="n" x="780" y="138" width="96" height="56" rx="6"/>
  <text class="t m" x="828" y="161.9">world 7</text>
  <text class="d m" x="828" y="180.9">last image</text>
  <text class="c" x="0" y="226">The launch covers the k listed worlds, packed first: frame time follows k, not nworld.</text>
  <text class="c" x="0" y="246">Write ids in place (e.g. where(done, -1, arange(nworld))), also inside a CUDA graph: no recompile, no host sync.</text>
</svg>
