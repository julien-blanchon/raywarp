<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1004 328" role="img">
  <title>Integrations: Newton, USD, Isaac Lab, MuJoCo Warp, mjlab and glTF each reach Raywarp through one scene() call or a sensor / renderer drop-in; device outputs feed torch and the policy</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="ct" x="0" y="12">one scene() call, or a drop-in for the source's own camera / renderer</text>
  <rect class="b" x="0" y="26" width="420" height="58" rx="6"/>
  <text class="t" x="12" y="51">Newton</text>
  <text class="d" x="128" y="51">newton.scene(model); with its USD stage:</text>
  <text class="d" x="128" y="69">load_usd(model, stage); SensorCamera</text>
  <path class="ln" d="M420,55 C440,55 440,136 468,136" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="92" width="420" height="40" rx="6"/>
  <text class="t" x="12" y="117">USD</text>
  <text class="d" x="128" y="117">usd.scene(stage)</text>
  <path class="ln" d="M420,112 C440,112 440,152 468,152" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="140" width="420" height="40" rx="6"/>
  <text class="t" x="12" y="165">Isaac Lab</text>
  <text class="d" x="128" y="165">RaywarpRendererCfg (tiled cameras)</text>
  <path class="ln" d="M420,160 C440,160 440,168 468,168" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="188" width="420" height="40" rx="6"/>
  <text class="t" x="12" y="213">MuJoCo Warp</text>
  <text class="d" x="128" y="213">mujoco.scene(mjm, m), render_context API</text>
  <path class="ln" d="M420,208 C440,208 440,184 468,184" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="236" width="420" height="40" rx="6"/>
  <text class="t" x="12" y="261">mjlab</text>
  <text class="d" x="128" y="261">RaywarpCameraSensorCfg (RGB sensors)</text>
  <path class="ln" d="M420,256 C440,256 440,200 468,200" marker-end="url(#ah)"/>
  <rect class="b" x="0" y="284" width="420" height="40" rx="6"/>
  <text class="t" x="12" y="309">glTF</text>
  <text class="d" x="128" y="309">gltf.scene(path)</text>
  <path class="ln" d="M420,304 C440,304 440,216 468,216" marker-end="url(#ah)"/>
  <rect class="g" x="470" y="126" width="160" height="100" rx="6"/>
  <text class="t m" x="550" y="154.9">Raywarp</text>
  <text class="d m" x="550" y="173.9">Renderer:</text>
  <text class="d m" x="550" y="190.9">nworld x ncam,</text>
  <text class="d m" x="550" y="207.9">one launch per step</text>
  <path class="ln" d="M630,176 H664" marker-end="url(#ah)"/>
  <rect class="g" x="666" y="136" width="170" height="80" rx="6"/>
  <text class="t m" x="751" y="163.4">device outputs</text>
  <text class="d m" x="751" y="182.4">rgb, depth, seg, ...</text>
  <text class="d m" x="751" y="199.4">(nworld, ncam, H, W)</text>
  <path class="ln" d="M836,176 H864" marker-end="url(#ah)"/>
  <rect class="b" x="866" y="136" width="134" height="80" rx="6"/>
  <text class="t m" x="933" y="163.4">torch, policy</text>
  <text class="d m" x="933" y="182.4">zero-copy views,</text>
  <text class="d m" x="933" y="199.4">CUDA graphs</text>
</svg>
