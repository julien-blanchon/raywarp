<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 924 274" role="img">
  <title>Shared scenery and per-world trees: static instances are stored and traced once; moving or per-world instances live in one tree per world</title>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .d { fill: #374151; }
    .c { fill: #7d8590; }
    .ct { fill: #7d8590; font-weight: 600; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
    rect, .k { stroke-width: 1.5; }
    .b { fill: #dbeafe; stroke: #2563eb; }
    .g { fill: #dcfce7; stroke: #16a34a; }
    .a { fill: #fef3c7; stroke: #d97706; }
    .v { fill: #ede9fe; stroke: #7c3aed; }
    .r { fill: #ffe4e6; stroke: #e11d48; }
    .n { fill: #f1f5f9; stroke: #64748b; }
    .f { fill: none; stroke: #7d8590; stroke-dasharray: 4 4; }
    .ln { fill: none; stroke: #7d8590; stroke-width: 1.5; }
    .ds { stroke-dasharray: 5 4; }
    .ah { fill: #7d8590; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="b" x="0" y="0" width="380" height="110" rx="6"/>
  <text class="t m" x="190" y="33.9">shared scenery</text>
  <text class="d m" x="190" y="52.9">static instances, one pose each:</text>
  <text class="d m" x="190" y="69.9">one shared BVH / OptiX IAS,</text>
  <text class="d m" x="190" y="86.9">every world traces it after its own tree</text>
  <rect class="a" x="0" y="140" width="380" height="76" rx="6"/>
  <text class="t m" x="190" y="165.4">PerWorld(visible=[...])</text>
  <text class="d m" x="190" y="184.4">(nworld, n) mask: hidden per world,</text>
  <text class="d m" x="190" y="201.4">still shared (tested where rays meet it)</text>
  <path class="ln" d="M190,140 V112" marker-end="url(#ah)"/>
  <rect class="g" x="440" y="0" width="210" height="50" rx="6"/>
  <text class="t m" x="545" y="20.9">world 0 tree</text>
  <text class="d m" x="545" y="39.9">refit every render</text>
  <path class="ln" d="M438,25 L382,55.0" marker-end="url(#ah)"/>
  <rect class="g" x="440" y="60" width="210" height="50" rx="6"/>
  <text class="t m" x="545" y="80.9">world 1 tree</text>
  <text class="d m" x="545" y="99.9">refit every render</text>
  <path class="ln" d="M438,85 L382,62.5" marker-end="url(#ah)"/>
  <rect class="g" x="440" y="166" width="210" height="50" rx="6"/>
  <text class="t m" x="545" y="186.9">world nworld-1 tree</text>
  <text class="d m" x="545" y="205.9">refit every render</text>
  <path class="ln" d="M438,191 L382,75.75" marker-end="url(#ah)"/>
  <circle class="ah" cx="545" cy="128" r="2"/>
  <circle class="ah" cx="545" cy="136" r="2"/>
  <circle class="ah" cx="545" cy="144" r="2"/>
  <text class="c m" x="545" y="236">one wp.Bvh grouped by world</text>
  <rect class="g" x="710" y="0" width="210" height="216" rx="6"/>
  <text class="t" x="720" y="52.9">per world when</text>
  <text class="d" x="720" y="71.9">the simulator moves it</text>
  <text class="d" x="720" y="88.9">(Binding.dynamic);</text>
  <text class="d" x="720" y="105.9">PerWorld(pose=, size=,</text>
  <text class="d" x="720" y="122.9">mesh=) declares it;</text>
  <text class="d" x="720" y="139.9">a batched table differs</text>
  <text class="d" x="720" y="156.9">between worlds; a plane</text>
  <text class="d" x="720" y="173.9">next to per-world ones</text>
  <path class="ln" d="M708,108 H652" marker-end="url(#ah)"/>
  <text class="c" x="0" y="262">sharing.decide runs once per Renderer; every frame, a shared instance that changed raises with the PerWorld fix.</text>
</svg>
