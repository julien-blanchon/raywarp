<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="sans-serif" font-size="13">
  <title>Shared scenery and per-world instances (core/sharing.py)</title>
  <style>
    text { fill: #1f2328; }
    .muted { fill: #57606a; font-size: 11px; }
    .h { font-weight: bold; font-size: 14px; }
    .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .head { fill: #57606a; }
    .shared { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .world { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.4; }
    .mask { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
    .dot { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head, .dot { fill: #9198a1; }
      .shared { fill: #0c2d6b; stroke: #4493f8; }
      .world { fill: #04260f; stroke: #3fb950; }
      .mask { fill: #3b2e00; stroke: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="shared" x="20" y="20" width="400" height="110" rx="6"/>
  <text class="h" x="220" y="44" text-anchor="middle">shared scenery (Layout.shared)</text>
  <text class="muted" x="220" y="66" text-anchor="middle">static instances: one pose each, one shared BVH / OptiX IAS,</text>
  <text class="muted" x="220" y="82" text-anchor="middle">built on the first render; every world traces it after its own</text>
  <text class="muted" x="220" y="104" text-anchor="middle">table, walls, floor props, scenery of a USD stage ...</text>
  <text class="muted" x="220" y="120" text-anchor="middle">checked every frame: common move refits, per-world move raises</text>

  <rect class="mask" x="20" y="150" width="400" height="74" rx="6"/>
  <text class="h" x="220" y="174" text-anchor="middle">PerWorld(visible=[...])</text>
  <text class="muted" x="220" y="194" text-anchor="middle">a (nworld, n) int mask on shared instances: stays shared;</text>
  <text class="muted" x="220" y="210" text-anchor="middle">software: skipped in traversal; OptiX: any-hit test</text>
  <path class="line" d="M220,150 V132" marker-end="url(#a)"/>

  <rect class="world" x="520" y="20" width="200" height="60" rx="6"/>
  <text class="h" x="620" y="44" text-anchor="middle">world 0 tree</text>
  <text class="muted" x="620" y="64" text-anchor="middle">robot links, pushed objects</text>
  <rect class="world" x="520" y="92" width="200" height="60" rx="6"/>
  <text class="h" x="620" y="116" text-anchor="middle">world 1 tree</text>
  <text class="muted" x="620" y="136" text-anchor="middle">refit every render</text>
  <circle class="dot" cx="620" cy="166" r="2.5"/>
  <circle class="dot" cx="620" cy="176" r="2.5"/>
  <circle class="dot" cx="620" cy="186" r="2.5"/>
  <rect class="world" x="520" y="198" width="200" height="60" rx="6"/>
  <text class="h" x="620" y="222" text-anchor="middle">world N-1 tree</text>
  <text class="muted" x="620" y="242" text-anchor="middle">(one wp.Bvh grouped by world)</text>
  <path class="line" d="M518,50 L422,70" marker-end="url(#a)"/>
  <path class="line" d="M518,122 L422,90" marker-end="url(#a)"/>
  <path class="line" d="M518,228 L422,110" marker-end="url(#a)"/>

  <rect class="world" x="760" y="20" width="185" height="238" rx="6"/>
  <text class="h" x="852" y="44" text-anchor="middle">per world when</text>
  <text class="muted" x="772" y="70">the simulator moves it</text>
  <text class="muted" x="772" y="86">(Binding.dynamic: joints,</text>
  <text class="muted" x="772" y="102">per-world mocap, Newton)</text>
  <text class="muted" x="772" y="126">PerWorld(pose= / size= /</text>
  <text class="muted" x="772" y="142">mesh=) declares it</text>
  <text class="muted" x="772" y="166">a batched table differs</text>
  <text class="muted" x="772" y="182">between worlds (implicit)</text>
  <text class="muted" x="772" y="206">a plane, when the world</text>
  <text class="muted" x="772" y="222">trees hold other instances</text>
  <path class="line" d="M758,140 H722" marker-end="url(#a)"/>

  <text class="muted" x="20" y="290">sharing.decide(scene, binding, PerWorld, slots) runs once per Renderer and returns the Layout (shared ids, pose columns,</text>
  <text class="muted" x="20" y="306">visibility slots). The same rule serves every adapter; nothing shared compiles the kernels of a scene without sharing.</text>
</svg>
