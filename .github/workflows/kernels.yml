# Builds and publishes the prebuilt GPU kernels of every architecture: the multi-architecture fill
# (tools/prebuilt/fill_all.sh refill: sm_120, sm_89, sm_86 OptiX bundles with their module packs,
# sm_90 and sm_80 software-path bundles), run as HF jobs this workflow launches and follows, then
# laid out, pinned and published to the public storage bucket blanchon/raywarp-kernels the renderer
# downloads from on first use (raywarp/core/build/kernel_cache/store.py). WRITTEN, NOT RUN YET:
# the first run is the user's decision (cost below).
#
# Triggers: a release tag (v*) and by hand (workflow_dispatch: the architectures, a dry run, the
# publish switch). The bucket is mutable, so the layout is the versioning: a content key (and a
# pack under it) is uploaded once and never written again (tools/release/kernels.py publish
# refuses one the bucket holds); a new fill is a new content key. The pins (raywarp/core/build/
# kernel_cache/kernels.json: every architecture's bundle, the sha256 of its file list and its packs
# per NVIDIA driver: tools/release/kernels.py) are written by the run: uploaded as the artifact
# `kernels-pins` and proposed as a pull request (branch kernels/<tag>); the wheels of a release
# carry the pins merged before its tag (release.yml).
#
# The fill outlives one GitHub job (6 h) when queues are long: its state (.fill_all/<tag>: each HF
# job's run id, the waves passed) is saved to the Actions cache at the end of every run, success or
# not, and restored at the start, so running the workflow again with the same tag resumes it (jobs
# done stay done; a running HF job is followed, not relaunched).
#
# Secret: HF_TOKEN, a Hugging Face token of the account owning both buckets with write access:
#   - HF jobs (launch, follow, logs) on that account (billed to it);
#   - the project bucket blanchon/mujoco-warp-pbr (runs/: the code archive of each job, the
#     hand-over archives, spend/budgets.json: the launches count against lane `release`'s budget);
#   - the kernels bucket blanchon/raywarp-kernels (written only when publishing).
# GITHUB_TOKEN (automatic) opens the pins pull request (contents + pull-requests: write).
#
# Cost per release (worst case: every job to its cap, `fill_all.sh cost`; prices of `hf jobs
# hardware` on 2026-11-16: cpu-upgrade $0.03/h, cpu-performance $1.90/h, l4x1 $0.80/h, a10g-large
# $1.50/h, rtx-pro-6000 $2.75/h):
#   sm_120  79 jobs  $20.64  (9 packs x 35 min rtx-pro-6000 $14.44, release cpu-performance $3.80,
#                             40 PTX + 16 Warp shards + 12 lists + merge on cpu-upgrade $2.40)
#   sm_89   76 jobs   $9.00  (6 packs x 35 min l4x1 $2.80, release $3.80, CPU shards $2.40)
#   sm_86   74 jobs   $9.70  (4 packs x 35 min a10g-large $3.50, release $3.80, CPU shards $2.40)
#   sm_90   30 jobs   $0.96  (software path: 12 lists + 16 Warp shards + merge + release, cpu-upgrade)
#   sm_80   30 jobs   $0.96
#   census   9 jobs   $1.61  (8 cpu-upgrade + 1 cpu-performance for the large prepared stages)
#   total            $42.86 worst; expected ~$15-20 (the W10 / W15 refills: packs ~70 % of their
#                    cap, CPU shards ~40 %, release ~30 min). A dry run (dry: true) is ~12
#                    cpu-upgrade jobs, worst $0.17.
# The GitHub runner itself only launches and polls (ubuntu-latest, free for a public repository).
name: Kernels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      archs:
        description: "SM versions to fill (space separated)"
        default: "120 89 86 90 80"
      dry:
        description: "CPU-only dry run (tiny: 2 architectures by default, no pack, scratch upload)"
        type: boolean
        default: true
      publish:
        description: "Upload the layout to the kernels bucket (a dry run: under scratch/dry-<tag>)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kernels-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TAG: kernels-${{ github.ref_name }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
      PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && '1' || '0' }}
      ARCHS_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.archs || '120 89 86 90 80' }}
      WATCH_EVERY: "300"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SEED=auto reads the pins' last commit and diffs the OptiX options code
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv tool install "huggingface_hub[cli]>=1.0"
      - name: Interpreter of tools.hf and tools.release (no project install, so no native build)
        run: |
          warp=$(python3 -c 'import tomllib; d = tomllib.load(open("pyproject.toml", "rb")); print(next(x for x in d["project"]["dependencies"] if x.startswith("warp-lang")))')
          echo "PY=uv run --no-project --python 3.12 --with numpy --with $warp --index-strategy unsafe-best-match --extra-index-url https://pypi.nvidia.com python" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore the fill state (resume)
        uses: actions/cache/restore@v4
        with:
          path: .fill_all
          key: fill-state-${{ env.TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fill-state-${{ env.TAG }}-
      - name: Fill, pack, lay out (HF jobs)
        run: |
          # A dry run with the default input keeps fill_all.sh's two dry architectures.
          if [ "$DRY" != 1 ] || [ "$ARCHS_IN" != "120 89 86 90 80" ]; then export ARCHS="$ARCHS_IN"; fi
          tools/prebuilt/fill_all.sh cost "$TAG"
          tools/prebuilt/fill_all.sh refill "$TAG"
      - name: Save the fill state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fill_all
          key: fill-state-${{ env.TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == '1'
        with:
          name: kernels-pins
          path: |
            raywarp/core/build/kernel_cache/kernels.json
            .fill_all/${{ env.TAG }}.kernels.json
          if-no-files-found: ignore
      - name: Propose the pins (pull request)
        if: env.PUBLISH == '1' && env.DRY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- raywarp/core/build/kernel_cache/kernels.json && { echo "pins unchanged"; exit 0; }
          branch="kernels/${GITHUB_REF_NAME}"
          content=$(python3 -c 'import json; print(", ".join(f"sm{a} bundle {b[\"content\"]}" for a, b in sorted(json.load(open("raywarp/core/build/kernel_cache/kernels.json"))["bundles"].items())))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add raywarp/core/build/kernel_cache/kernels.json
          git commit -m "kernels.json: pins of the published ${content} (refill ${TAG} from ${GITHUB_SHA})"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Kernel pins for ${GITHUB_REF_NAME}" \
            --body "Pins of the multi-architecture fill ${TAG} (run ${GITHUB_RUN_ID}): ${content}."
